<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f3" />
    <meta
      name="description"
      content="Discover internships and early-career opportunities around the world."
    />
    <title>fleo-jobs — Find opportunities worldwide</title>
    <script>
      try {
        const theme = localStorage.getItem("fleo-jobs-theme");
        if (theme === "dark" || theme === "light") document.documentElement.classList.add(theme);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
